plugins {
    id 'fabric-loom'
}

repositories {
    mavenCentral()
}

// Family 1.21.11 (Identifier replaces ResourceLocation). Compiled against the lowest version (1.21.11) unless
// -PcheckMc=<version> names another member of this family (verification only, see README).
// checkMc is ignored (lowest used) when it names a version outside this family, so configuring other projects still works.
def checkMc = findProperty('checkMc')
def target = checkMc != null && rootProject.ext.families.mc12111.contains(checkMc) ? checkMc : rootProject.ext.families.mc12111[0]

dependencies {
    minecraft "com.mojang:minecraft:${target}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${rootProject.ext.loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.ext.fabricApi[target]}"
    implementation project(':core')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}
