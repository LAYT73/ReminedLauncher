name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Write Vite env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          URL="${VITE_SUPABASE_URL:-https://ymfggtkgthknizugadoi.supabase.co}"
          KEY="${VITE_SUPABASE_ANON_KEY:-}"
          if [ -z "$KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY secret is empty — set it in repo Settings → Secrets" >&2
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env

      - name: Updater args (only if signing key present)
        id: updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "extra=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
            echo "upload_updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "extra=" >> "$GITHUB_OUTPUT"
            echo "upload_updater=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v0.9.4
          releaseName: Remined v0.9.4
          releaseBody: |
            Remined launcher v0.9.4 — remote webcam tiles without local cam; mute icon fix; LocalSkin/CSL stale skin; guest kicked when host ends room off Voice tab.
            macOS (arm64 + x64) and Windows builds.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }} ${{ steps.updater.outputs.extra }}
          includeUpdaterJson: ${{ steps.updater.outputs.upload_updater }}
