[package]
name = "remined"
version = "0.6.1"
description = "Remined Minecraft Launcher"
authors = ["Remined"]
edition = "2021"
default-run = "remined"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "remined-cli"
path = "src/bin/remined_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", features = ["rustls", "stream", "json", "blocking"] }
zip = "9.0.2"
flate2 = "1.1.10"
tar = "0.4.46"
tauri-plugin-fs = "2.7.0"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-global-shortcut = "2"
uuid = { version = "1.28.0", features = ["v3", "std"] }
futures = "0.3.34"
tokio = { version = "1.53.2", features = ["time", "rt", "macros"] }
libc = "0.2"
jsonwebtoken = "9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "alloc"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# BUG-002: unwind (not abort) so a panic on a tokio worker is logged by the
# panic hook and surfaces as a task error instead of SIGABRT-ing the launcher.
panic = "unwind"
strip = true
